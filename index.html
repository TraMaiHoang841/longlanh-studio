<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="longlanh.studio: women's clothing that shimmers. Long lanh (noun): where the sunlight dances with the water.">
<meta property="og:title" content="longlanh.studio">
<meta property="og:description" content="Long lanh (noun): where the sunlight dances with the water, sometimes softly, sometimes fiercely.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23151319'/%3E%3Ctext x='16' y='23' font-family='Georgia' font-size='20' fill='white' text-anchor='middle'%3El%3C/text%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>longlanh.studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=GFS+Didot&family=Jost:wght@300;400;500;600&display=swap">
<style>
/* Layout: Shasa-style storefront — promo marquee, centered wordmark header, full-bleed hero, edge-to-edge product rails; admin is a dense two-pane tool behind the same header. */
:root{
  --bg:#ffffff; --fg:#151319; --muted:#6e6a75; --line:#e6e3ea; --soft:#f5f3f7; --ink-invert:#ffffff;
  --sale:#b42318; --ok:#1d7448; --warn:#9a5b00; --info:#3a4cc0;
  --pearl:linear-gradient(100deg,#b9a6ff 0%,#ffbfdc 30%,#ffe7b0 50%,#aeeaff 72%,#c9b8ff 100%);
  --f-display:"Didot","GFS Didot","Bodoni 72","Bodoni MT",Georgia,serif;
  --f-ui:"Jost","Futura","Century Gothic","Avenir Next",system-ui,sans-serif;
  --gut-l:max(16px, env(safe-area-inset-left,0px)); --gut-r:max(16px, env(safe-area-inset-right,0px));
  --hdr-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111014; --fg:#f1eff4; --muted:#a39fab; --line:#2a2830; --soft:#1a191f; --ink-invert:#111014;
  --sale:#ff8f80; --ok:#62d39c; --warn:#f2b45c; --info:#9aa8ff; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111014; --fg:#f1eff4; --muted:#a39fab; --line:#2a2830; --soft:#1a191f; --ink-invert:#111014;
  --sale:#ff8f80; --ok:#62d39c; --warn:#f2b45c; --info:#9aa8ff; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:0;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--fg)}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0;font-weight:400}
.wrap{padding-left:var(--gut-l);padding-right:var(--gut-r)}
.cap{text-transform:uppercase;letter-spacing:.14em;font-size:12px;font-weight:500}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 26px;background:var(--fg);color:var(--ink-invert);text-transform:uppercase;letter-spacing:.14em;font-size:12px;font-weight:500;border:1px solid var(--fg);transition:opacity .2s}
.btn:hover{opacity:.85}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--fg)}
.btn.sm{min-height:36px;padding:0 14px;font-size:11px}
.btn.full{width:100%}
.link{text-decoration:underline;text-underline-offset:3px;text-transform:uppercase;letter-spacing:.12em;font-size:12px;font-weight:500}
.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.4}

/* promo marquee */
#promo{background:var(--fg);color:var(--ink-invert);overflow:hidden;white-space:nowrap;height:34px;display:flex;align-items:center}
.marq{display:inline-flex;gap:64px;padding-left:64px;animation:marq 38s linear infinite;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:500}
.marq span{display:inline-flex;align-items:center;gap:64px}
.marq span::after{content:"✦";opacity:.6}
@keyframes marq{to{transform:translateX(-50%)}}

/* header */
#hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg);border-bottom:1px solid var(--line)}
.hdr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:var(--hdr-h)}
.nav{display:flex;gap:26px;align-items:center}
.nav > *{position:relative}
.nav a,.nav button.nl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;padding:22px 0}
.nav a:hover,.nav button.nl:hover{text-decoration:underline;text-underline-offset:5px}
.dd{position:absolute;top:100%;left:-24px;background:var(--bg);border:1px solid var(--line);padding:16px 24px;min-width:220px;display:none;flex-direction:column;gap:2px}
.dd a{padding:6px 0;text-transform:none;letter-spacing:.02em;font-size:14px;font-weight:400}
.nav > div:hover .dd,.nav > div:focus-within .dd{display:flex}
.logo{display:flex;align-items:baseline;gap:2px;font-family:var(--f-display);font-size:32px;line-height:1;letter-spacing:.02em}
.logo small{font-family:var(--f-ui);font-size:10px;letter-spacing:.24em;text-transform:uppercase;font-weight:500;margin-left:4px;color:var(--muted)}
.logo .star{width:12px;height:12px;align-self:flex-start;margin-left:2px}
.tools{display:flex;justify-content:flex-end;gap:18px;align-items:center}
.tools .admin-link{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;border:1px solid var(--line);padding:6px 10px}
.bag{position:relative}
.bag b{position:absolute;top:-6px;right:-9px;background:var(--fg);color:var(--ink-invert);font-size:10px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;font-weight:500;padding:0 4px}
.burger{display:none}
@media (max-width:900px){
  .nav{display:none}.burger{display:inline-flex}
  .logo{font-size:26px}.logo small{display:none}
  .tools .admin-link{display:none}
}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);border-bottom:1px solid var(--line)}
.hero-copy{display:flex;flex-direction:column;justify-content:flex-end;gap:22px;padding-block:72px 56px}
.hero h1{font-family:var(--f-display);font-size:clamp(26px,2.4vw,34px);line-height:1;letter-spacing:.04em;color:var(--fg)}
.shine{background:var(--pearl);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 7s ease-in-out infinite alternate}
@keyframes sheen{from{background-position:0% 50%}to{background-position:100% 50%}}
.hero p{max-width:40ch;font-size:17px;color:var(--muted);margin:0}
.hero .hero-copy{justify-content:center;align-items:center;text-align:center;gap:14px}
.hero .hero-ctas{justify-content:center;margin-top:8px}
/* moving water behind the definition */
.hero .hero-copy{position:relative;overflow:hidden;isolation:isolate;color:#151319}
.hero .hero-copy::before{content:"";position:absolute;inset:-12%;z-index:-2;background:linear-gradient(180deg,#cce8ef,#a3d2df);will-change:transform}
.hero .hero-copy::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.38) 50%,transparent 62%) 0 0/260% 100% no-repeat,radial-gradient(ellipse 42% 34% at 50% 50%,rgba(255,255,255,.55),rgba(255,255,255,0)) 0 0/100% 100% no-repeat,rgba(255,255,255,.18);animation:glint 11s ease-in-out infinite}
@keyframes drift{0%{transform:scale(1) translate(0,0)}50%{transform:scale(1.08) translate(-3%,-4%)}100%{transform:scale(1.04) translate(2%,-2%)}}
@keyframes glint{0%{background-position:120% 0,0 0,0 0}60%,100%{background-position:-60% 0,0 0,0 0}}
.hero .hero-copy canvas.water{position:absolute;inset:0;width:100%;height:100%;z-index:-2;display:block}
.hero .hero-copy.gl::before{display:none}
.hero .hero-copy h1,.hero .def{color:#151319;text-shadow:0 0 18px rgba(255,255,255,.7);transition:color 3s,text-shadow 3s}
.hero .hero-copy::after{transition:opacity 3s}
.hero .hero-copy.night::after{opacity:0}
.hero .hero-copy.night h1,.hero .hero-copy.night .def{color:#eef2ff;text-shadow:0 0 18px rgba(4,8,30,.8)}
.hero .hero-copy.night .hero-ctas .btn{background:#eef2ff;color:#0b1026;border-color:#eef2ff}
.hero .hero-copy.night .hero-ctas .btn.ghost{background:rgba(10,16,40,.35);color:#eef2ff}
.hero .hero-ctas .btn{background:#151319;color:#fff;border-color:#151319}
.hero .hero-ctas .btn.ghost{background:rgba(255,255,255,.55);color:#151319}
.def{margin:0;display:grid;gap:4px;max-width:38ch}
.def div{display:block}
.def dt{display:inline;font-style:italic;font-family:var(--f-display);font-size:15px;margin-right:6px}
.def dd{display:inline;margin:0;font-family:var(--f-display);font-size:16px;line-height:1.45}
.hero-img .def dt{color:#fff}
.hero-ctas{display:flex;gap:12px;flex-wrap:wrap}
.hero-pics{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--line)}
.hero-pics a{display:block;position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--soft)}
.hero-pics a:nth-child(2){transform:none}
.hero-pics svg,.hero-pics img{width:100%;height:100%;object-fit:cover;display:block}
.hero-pics{align-self:stretch;align-content:stretch}
.hero-pics .lbl{position:absolute;left:12px;bottom:12px;background:var(--bg);padding:6px 10px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:500}
.hero-img{position:relative;min-height:min(78vh,720px);display:flex;align-items:flex-end;overflow:hidden;border-bottom:1px solid var(--line)}
.hero-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-img .hero-copy{position:relative;color:#fff;text-shadow:0 1px 18px rgba(0,0,0,.35)}
.hero-img .hero-copy p{color:#fff}
@media (min-width:901px){.hero-pics a{aspect-ratio:auto;min-height:100%}}
@media (max-width:900px){.hero{grid-template-columns:1fr}.hero-copy{padding-block:40px 32px}}

/* category strip */
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--line)}
.cats a{display:flex;flex-direction:column;justify-content:space-between;gap:6px;padding:26px 0;border-right:1px solid var(--line);padding-right:16px;padding-left:16px}
.cats a:first-child{padding-left:0}
.cats a:last-child{border-right:0}
.cats .cap{white-space:nowrap}
.cats .n{font-family:var(--f-display);font-size:clamp(24px,2.6vw,36px)}
.cats a:hover .n{font-style:italic}
@media (max-width:700px){.cats{grid-template-columns:1fr 1fr}.cats a{padding-left:0!important;border-right:0;border-bottom:1px solid var(--line)}}

/* sections */
.sec{padding-block:56px 24px}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px}
.sec-h h2{font-family:var(--f-display);font-size:clamp(34px,4vw,54px);line-height:1}
.rail-ctrl{display:flex;gap:6px}
.rail-ctrl button{width:40px;height:40px;border:1px solid var(--line);display:grid;place-items:center}
.rail-ctrl button:hover{border-color:var(--fg)}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 3*14px)/4);gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:6px}
.rail::-webkit-scrollbar{display:none}
.rail > *{scroll-snap-align:start}
@media (max-width:1000px){.rail{grid-auto-columns:calc((100% - 2*14px)/2.6)}}
@media (max-width:560px){.rail{grid-auto-columns:72%}}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:30px 14px}
@media (max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 10px}}

/* product card */
.card{display:flex;flex-direction:column;gap:6px;min-width:0}
.media{position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--soft)}
.media > a{position:absolute;inset:0;display:block}
.media img,.media svg{width:100%;height:100%;object-fit:cover;display:block}
.media .alt{position:absolute;inset:0;opacity:0;transition:opacity .35s}
.card:hover .media .alt{opacity:1}
.badge{position:absolute;top:10px;left:10px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;padding:4px 8px;background:var(--bg);color:var(--fg);pointer-events:none}
.badge.new{background:var(--pearl);color:#151319}
.badge.out{background:var(--fg);color:var(--ink-invert)}
.quick{position:absolute;left:8px;right:8px;bottom:8px;background:color-mix(in srgb,var(--bg) 94%,transparent);padding:10px;display:flex;flex-direction:column;gap:8px;transform:translateY(calc(100% + 10px));transition:transform .3s}
.card:hover .quick,.quick:focus-within{transform:none}
.quick .cap{font-size:10px}
.quick .sz{display:flex;flex-wrap:wrap;gap:4px}
.quick button{min-width:34px;height:30px;border:1px solid var(--line);font-size:12px;padding:0 6px}
.quick button:hover:not([disabled]){border-color:var(--fg)}
.quick button[disabled]{color:var(--muted);text-decoration:line-through;cursor:not-allowed}
@media (hover:none){.quick{display:none}}
.card-name{font-size:14px;margin-top:4px}
.price{display:flex;gap:8px;font-size:14px;align-items:baseline}
.price s{color:var(--muted);font-size:13px}
.price .now.sale{color:var(--sale)}
.sw{display:flex;gap:5px}
.sw i{width:12px;height:12px;border-radius:50%;border:1px solid var(--line);display:block}
.skel{background:var(--soft);aspect-ratio:3/4;position:relative;overflow:hidden}
.skel::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--bg) 60%,transparent),transparent);animation:sk 1.4s infinite;transform:translateX(-100%)}
@keyframes sk{to{transform:translateX(100%)}}

/* mood */
.mood{display:grid;grid-template-columns:1fr 1fr;gap:2px;margin-top:56px}
.mood a{position:relative;min-height:440px;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;padding:32px;overflow:hidden}
.mood a{isolation:isolate}
.mood a canvas.water{position:absolute;inset:0;width:100%;height:100%;z-index:-1;display:block}
.mood .m1{background:#4a2f5e;color:#fbf7ff;text-shadow:0 1px 16px rgba(20,8,40,.55)}
.mood .m2{background:#e9e2cf;color:#1d1a16;text-shadow:0 0 16px rgba(255,250,235,.6)}
.mood h3{font-family:var(--f-display);font-size:clamp(40px,5vw,72px);line-height:.95;position:relative}
.mood p{margin:0;max-width:34ch;position:relative;opacity:.8}
.mood .link{position:relative}
.mood svg.figs{position:absolute;right:-20px;top:-10px;height:95%;width:auto;opacity:.95}
.mood .sparks{position:absolute;inset:0;pointer-events:none}
@media (max-width:760px){.mood{grid-template-columns:1fr}.mood a{min-height:340px}}

/* newsletter + footer */
.news{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:end;padding-block:72px;border-top:1px solid var(--line);margin-top:72px}
.news h2{font-family:var(--f-display);font-size:clamp(36px,4.4vw,60px);line-height:1}
.news form{display:flex;gap:0}
.news input{border-right:0}
.news small{display:block;margin-top:10px;color:var(--muted);font-size:12px}
@media (max-width:760px){.news{grid-template-columns:1fr}}
#ftr{background:var(--soft);border-top:1px solid var(--line)}
.ft{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px;padding-block:48px}
.ft h4{margin:0 0 12px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.ft ul{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14px}
.ft button{text-align:left}
.ft button:hover,.ft a:hover{text-decoration:underline}
.ft-bottom{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:18px 28px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.ft-bottom .logo{font-size:24px;color:var(--fg)}
@media (max-width:760px){.ft{grid-template-columns:1fr 1fr}}

/* collection */
.coll-h{padding-block:40px 20px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end;border-bottom:1px solid var(--line);margin-bottom:24px}
.coll-h h1{font-family:var(--f-display);font-size:clamp(40px,6vw,80px);line-height:1}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{height:34px;padding:0 12px;border:1px solid var(--line);font-size:12px;letter-spacing:.06em;display:inline-flex;align-items:center}
.chip.on{background:var(--fg);color:var(--ink-invert);border-color:var(--fg)}
.filters select{width:auto;height:34px;padding:0 10px;font-size:12px}
.empty{padding:64px 0;text-align:center;display:grid;gap:12px;justify-items:center}
.empty h3{font-family:var(--f-display);font-size:34px}

/* product page */
.pdp{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:40px;padding-block:28px 40px}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.gal .media{aspect-ratio:3/4}
.info{position:sticky;top:calc(var(--hdr-h) + 24px);align-self:start;display:flex;flex-direction:column;gap:18px;min-width:0}
.info h1{font-family:var(--f-display);font-size:clamp(34px,3.6vw,50px);line-height:1.02}
.info .price{font-size:18px}
.opt{display:grid;gap:8px}
.opt .row{display:flex;flex-wrap:wrap;gap:6px}
.opt .clr{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);outline:1px solid transparent;outline-offset:3px}
.opt .clr.on{outline-color:var(--fg)}
.opt .size{min-width:48px;height:42px;border:1px solid var(--line);padding:0 10px;font-size:13px}
.opt .size.on{background:var(--fg);color:var(--ink-invert);border-color:var(--fg)}
.opt .size[disabled]{color:var(--muted);text-decoration:line-through;cursor:not-allowed}
.stockhint{font-size:13px}
.stockhint.low{color:var(--warn)}
.qty{display:inline-flex;border:1px solid var(--line);height:46px;align-items:center}
.qty button{width:40px;height:100%}
.qty span{min-width:28px;text-align:center}
.buy{display:flex;gap:10px}
.buy .btn{flex:1}
details{border-top:1px solid var(--line);padding:14px 0}
details:last-of-type{border-bottom:1px solid var(--line)}
summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
summary::after{content:"+"}
details[open] summary::after{content:"–"}
details p,details div.d{margin:10px 0 0;color:var(--muted);font-size:14px;white-space:pre-line}
.crumbs{font-size:12px;color:var(--muted);padding-top:20px}
.crumbs a:hover{text-decoration:underline}
@media (max-width:860px){.pdp{grid-template-columns:1fr}.info{position:static}.gal{grid-template-columns:1fr 1fr}}

/* drawer / modal / toast */
.scrim{position:fixed;inset:0;background:rgba(10,9,12,.42);z-index:80;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--bg);z-index:90;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);animation:slide .28s ease}
.drawer.left{left:0;right:auto;padding-left:env(safe-area-inset-left,0px);padding-right:0;animation-name:slideL}
@keyframes slide{from{transform:translateX(100%)}}
@keyframes slideL{from{transform:translateX(-100%)}}
.dh{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.db{flex:1;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:16px}
.df{padding:16px 20px;border-top:1px solid var(--line);display:grid;gap:12px}
.ship{font-size:13px}
.ship .bar{height:3px;background:var(--line);margin-top:8px;position:relative}
.ship .bar i{position:absolute;inset:0 auto 0 0;background:var(--fg)}
.line{display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:start}
.line .media{aspect-ratio:3/4}
.line .nm{font-size:14px}
.line .meta{font-size:12px;color:var(--muted)}
.line .qty{height:32px;margin-top:8px}
.line .qty button{width:30px}

.chart svg{width:100%;height:auto;display:block}

table.t{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
table.t th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--soft);white-space:nowrap}
table.t td:first-child,table.t td:nth-child(2){white-space:nowrap}

table.t .thumb{width:40px;aspect-ratio:3/4;overflow:hidden;background:var(--soft)}
table.t .thumb svg,table.t .thumb img{width:100%;height:100%;object-fit:cover;display:block}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--soft)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;padding:3px 9px;border:1px solid currentColor;white-space:nowrap}

.bars{display:grid;gap:10px}

.stockgrid input.zero{border-color:var(--sale)}
.imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.imgs .im{position:relative;aspect-ratio:3/4;background:var(--soft);overflow:hidden}

.err{color:var(--sale);font-size:13px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<div id="promo" aria-label="Store announcements"></div>
<header id="hdr"></header>
<main id="app"></main>
<footer id="ftr"></footer>
<div id="layer"></div>
<div id="toast" hidden></div>

<script>
/* ============ constants ============ */
const CATS=[
 {id:"dresses",label:"Dresses",art:"dress"},
 {id:"tops",label:"Tops",art:"top"},
 {id:"bottoms",label:"Pants & Denim",art:"pants"},
 {id:"skirts",label:"Skirts",art:"skirt"},
 {id:"knitwear",label:"Knitwear",art:"knit"},
 {id:"outerwear",label:"Outerwear",art:"coat"},
 {id:"sets",label:"Matching Sets",art:"set"}];
const EDITS=[
 {id:"after-dark",label:"After Dark",tag:"evening",blurb:"Satin, shine and sequins for late plans."},
 {id:"soft-hours",label:"Soft Hours",tag:"linen",blurb:"Linen, easy knits and quiet layers."},
 {id:"basics",label:"Everyday Basics",tag:"basics",blurb:"The pieces you reach for first."}];
const TAGS=[["new","New in"],["bestseller","Best seller"],["evening","After Dark"],["linen","Soft Hours"],["basics","Basics"]];
const STATUSES=["requested","confirmed","paid","shipped","cancelled"];
const CHANNELS=["Website","Instagram","In person","Pop-up market","Other"];
const DEFAULTS={
 promos:["Free U.S. shipping on orders $99+","New pieces drop every Friday","Local pickup available at the studio"],
 freeShip:99,email:"",instagram:"longlanh.studio",lowStock:3,
 heroTitle:"Long Lanh",heroSub:"where the sunlight dances with the water, sometimes softly, sometimes fiercely.",heroVerb:"to shimmer / to gleam",heroImage:null,
 shipping:"Orders ship within 2–3 business days once payment is confirmed.\nFree U.S. shipping on orders over the threshold above; flat rate below it.",
 returns:"Unworn pieces with tags can be returned or exchanged within 14 days of delivery.\nSale items are final."};
const SIZE_GUIDE=[["XS","31–32","24–25","34–35"],["S","33–34","26–27","36–37"],["M","35–36","28–29","38–39"],["L","37–39","30–32","40–42"],["XL","40–42","33–35","43–45"]];

/* ============ state ============ */
const S={db:null,user:null,assets:null,dl:null,isAdmin:false,canWrite:null,
 dbState:"loading",products:[],orders:[],subs:[],settings:{...DEFAULTS},
 cart:loadCart(),pdp:{},filter:{size:null,sort:"new"},q:"",ofilter:"all",open:new Set(),draft:null,draftFor:null,busy:false,subsOn:false};

/* ============ utils ============ */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"$"+(Number(n)||0).toFixed(2);
const money0=n=>"$"+Math.round(Number(n)||0).toLocaleString("en-US");
const rid=(n=4)=>Array.from(crypto.getRandomValues(new Uint8Array(n)),b=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[b%32]).join("");
const slug=s=>String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40)||"item";
const K=(c,s)=>c+"|"+s;
const catOf=id=>CATS.find(c=>c.id===id)||{id,label:id||"Other",art:"top"};
const fmtDate=iso=>{try{return new Date(iso).toLocaleDateString("en-US",{month:"short",day:"numeric"})}catch(e){return ""}};
function loadCart(){try{return JSON.parse(localStorage.getItem("ll-cart")||"[]")}catch(e){return[]}}
function saveCart(){try{localStorage.setItem("ll-cart",JSON.stringify(S.cart))}catch(e){}}
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2800)}
const qtyOf=(p,c,s)=>Number((p.stock||{})[K(c,s)])||0;
const totalOf=p=>Object.values(p.stock||{}).reduce((a,b)=>a+(Number(b)||0),0);
const sizeQty=(p,s)=>(p.colors||[]).reduce((a,c)=>a+qtyOf(p,c.name,s),0);
const active=()=>S.products.filter(p=>p.status!=="draft");
const reorderOf=p=>Number(p.reorderPoint??S.settings.lowStock)||0;

/* ============ product art (placeholder until photos are uploaded) ============ */
const SHAPES={
 dress:'<path d="M127 60 L121 26 M173 60 L179 26" fill="none" stroke-width="3"/><path d="M116 60 H184 L190 96 L176 142 L238 374 Q150 390 62 374 L124 142 L110 96 Z"/>',
 top:'<path d="M96 96 L132 80 Q150 96 168 80 L204 96 L238 150 L208 166 L196 144 L198 314 L102 314 L104 144 L92 166 L62 150 Z"/>',
 pants:'<path d="M98 56 H202 L214 372 L166 372 L150 150 L134 372 L86 372 Z"/><path d="M98 76 H202" fill="none" stroke-width="2"/>',
 skirt:'<path d="M114 84 H186 L240 326 Q150 352 60 326 Z"/><path d="M114 100 H186" fill="none" stroke-width="2"/>',
 knit:'<path d="M98 86 L132 72 Q150 88 168 72 L202 86 L248 264 L220 274 L198 152 L200 318 L100 318 L102 152 L80 274 L52 264 Z"/><path d="M100 300 H200 M84 258 L52 250 M216 258 L248 250" fill="none" stroke-width="2"/>',
 coat:'<path d="M98 66 L136 54 L150 112 L164 54 L202 66 L244 296 L214 304 L200 170 L208 372 L92 372 L100 170 L86 304 L56 296 Z"/><path d="M150 112 V372 M120 230 h14 M120 270 h14" fill="none" stroke-width="2"/>',
 set:'<path d="M104 70 L134 60 Q150 72 166 60 L196 70 L206 150 L94 150 Z"/><path d="M110 168 H190 L232 360 Q150 380 68 360 Z"/>'};
let artN=0;
function hexRgb(h){h=String(h||"#cccccc").replace("#","");if(h.length===3)h=h.split("").map(x=>x+x).join("");const n=parseInt(h,16)||0;return[(n>>16)&255,(n>>8)&255,n&255]}
function mix(h,t,w){const a=hexRgb(h),b=hexRgb(t);return"rgb("+a.map((v,i)=>Math.round(v*(1-w)+b[i]*w)).join(",")+")"}
function lum(h){const[r,g,b]=hexRgb(h);return(0.299*r+0.587*g+0.114*b)/255}
function art(p,alt,ci){
 const c=(p.colors||[])[ci||0]||{hex:"#cfc8d6"};const hex=c.hex||"#cfc8d6";
 const bg=mix(hex,"#ffffff",lum(hex)>.8?.0:.86);const bgFinal=lum(hex)>.8?"#e9e6ee":bg;
 const ink=lum(hex)>.75?"#9d97a6":mix(hex,"#000000",.35);
 const id="a"+(++artN);
 const shape=SHAPES[catOf(p.category).art]||SHAPES.top;
 const tf=alt?'transform="translate(-105 -60) scale(1.7)"':'';
 const isEve=(p.tags||[]).includes("evening");
 const tex=alt?`<defs><pattern id="${id}" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(${isEve?0:35})">${isEve?'<circle cx="4" cy="4" r="1.3" fill="#fff" opacity=".55"/>':'<path d="M0 0 V8" stroke="#000" stroke-opacity=".12" stroke-width="2"/>'}</pattern></defs>`:"";
 return `<svg viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${esc(p.name)}">${tex}<rect width="300" height="400" fill="${bgFinal}"/><g ${tf} fill="${hex}" stroke="${ink}" stroke-width="1.5" stroke-linejoin="round">${shape}</g>${alt?`<g ${tf} fill="url(#${id})" stroke="none">${shape}</g>`:""}</svg>`;
}
const imgSrc=id=>String(id).includes("/")?String(id):"/_blob/"+id;
function imgTag(id,alt){return `<img src="${esc(imgSrc(id))}" alt="${esc(alt)}" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'skel'}))">`}
function media(p){const im=p.images||[];return[im[0]?imgTag(im[0],p.name):art(p,0),im[1]?imgTag(im[1],p.name):art(p,1)]}

/* ============ icons ============ */
const I={
 search:'<svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>',
 bag:'<svg class="ico" viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 016 0v2"/></svg>',
 menu:'<svg class="ico" viewBox="0 0 24 24"><path d="M3 7h18M3 12h18M3 17h18"/></svg>',
 x:'<svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
 l:'<svg class="ico" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
 r:'<svg class="ico" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
 star:'<svg class="star" viewBox="0 0 24 24"><defs><linearGradient id="pg" x1="0" x2="1"><stop offset="0" stop-color="#b9a6ff"/><stop offset=".5" stop-color="#ffbfdc"/><stop offset="1" stop-color="#aeeaff"/></linearGradient></defs><path d="M12 0C13 8 16 11 24 12 16 13 13 16 12 24 11 16 8 13 0 12 8 11 11 8 12 0Z" fill="url(#pg)"/></svg>'};
const logo=()=>`<a class="logo" href="#" aria-label="longlanh.studio home">longlanh<small>studio</small></a>`;

/* ============ chrome: promo, header, footer ============ */
function renderChrome(){
 const pr=(S.settings.promos||[]).filter(Boolean);const run=pr.map(t=>`<span>${esc(t)}</span>`).join("");
 $("#promo").innerHTML=pr.length?`<div class="marq">${run}${run}${run}${run}</div>`:"";
 $("#promo").hidden=!pr.length;
 const count=S.cart.reduce((a,l)=>a+l.qty,0);
 const lowN=S.isAdmin?lowVariants().length:0;const reqN=S.orders.filter(o=>o.status==="requested").length;
 $("#hdr").innerHTML=`<div class="hdr wrap">
  <nav class="nav" aria-label="Main">
   <a href="#shop-new">New in</a>
   <div><button class="nl" aria-haspopup="true">Clothing</button><div class="dd"><a href="#shop-all">View all</a>${CATS.map(c=>`<a href="#shop-${c.id}">${c.label}</a>`).join("")}</div></div>
   <div><button class="nl" aria-haspopup="true">Edits</button><div class="dd"><a href="#shop-best">Best sellers</a>${EDITS.map(e=>`<a href="#edit-${e.id}">${e.label}</a>`).join("")}</div></div>
   <a href="#shop-sale">Sale</a>
  </nav>
  <div style="display:flex;align-items:center;gap:10px"><button class="burger" data-act="menu" aria-label="Open menu">${I.menu}</button>${logo()}</div>
  <div class="tools">
   ${S.isAdmin?`<a class="admin-link" href="#admin">Inventory${reqN?` · ${reqN} new`:""}</a>`:""}
   <button data-act="search" aria-label="Search">${I.search}</button>
   <button class="bag" data-act="cart" aria-label="Bag, ${count} items">${I.bag}${count?`<b>${count}</b>`:""}</button>
  </div></div>`;
 const st=S.settings;
 $("#ftr").innerHTML=`<div class="ft wrap">
  <div><h4>Need help?</h4><ul>${st.email?`<li class="tnum" style="user-select:all">${esc(st.email)}</li>`:""}${st.instagram?`<li><a href="https://instagram.com/${esc(st.instagram)}" target="_blank" rel="noopener">Instagram @${esc(st.instagram)}</a></li>`:""}<li class="muted">Replies Monday–Saturday</li></ul></div>
  <div><h4>About</h4><ul><li><button data-act="info" data-k="story">Our story</button></li><li><button data-act="info" data-k="size">Size guide</button></li></ul></div>
  <div><h4>Help center</h4><ul><li><button data-act="info" data-k="shipping">Shipping</button></li><li><button data-act="info" data-k="returns">Returns & exchanges</button></li><li><button data-act="info" data-k="order">How ordering works</button></li></ul></div>
  <div><h4>Shop</h4><ul><li><a href="#shop-new">New in</a></li><li><a href="#shop-best">Best sellers</a></li><li><a href="#shop-sale">Sale</a></li>${S.isAdmin?`<li><a href="#admin">Inventory</a></li>`:""}</ul></div>
 </div><div class="ft-bottom wrap">${logo()}<span>© 2026 longlanh.studio · <i>long lanh</i>: to shimmer, to gleam</span></div>`;
}

/* ============ storefront pieces ============ */
function priceHtml(p){const sale=p.compareAt&&Number(p.compareAt)>Number(p.price);return `<div class="price tnum"><span class="now ${sale?"sale":""}">${money(p.price)}</span>${sale?`<s>${money(p.compareAt)}</s>`:""}</div>`}
function badge(p){if(!totalOf(p))return'<span class="badge out">Sold out</span>';if(p.compareAt&&Number(p.compareAt)>Number(p.price))return'<span class="badge">Sale</span>';if((p.tags||[]).includes("new"))return'<span class="badge new">New</span>';return""}
function card(p){
 const[m0,m1]=media(p);const sizes=p.sizes||[];
 return `<article class="card"><div class="media"><a href="#product-${p.id}" aria-label="${esc(p.name)}">${m0}<span class="alt">${m1}</span></a>${badge(p)}
  ${totalOf(p)?`<div class="quick"><span class="cap">Quick add</span><div class="sz">${sizes.map(s=>`<button data-act="quick" data-id="${p.id}" data-size="${esc(s)}" ${sizeQty(p,s)?"":"disabled"}>${esc(s)}</button>`).join("")}</div></div>`:""}</div>
  <a class="card-name" href="#product-${p.id}">${esc(p.name)}</a>${priceHtml(p)}
  ${(p.colors||[]).length>1?`<div class="sw">${p.colors.map(c=>`<i style="background:${esc(c.hex)}" title="${esc(c.name)}"></i>`).join("")}</div>`:""}</article>`;
}
const skels=n=>Array.from({length:n},()=>`<div class="card"><div class="skel"></div></div>`).join("");
function catalogNote(){
 if(S.dbState==="loading")return null;
 if(S.dbState==="none"||S.dbState==="error")return `<div class="empty"><h3>The new collection is on its way</h3><p class="muted">Sign in to browse the live catalog, or follow ${S.settings.instagram?`<a class="link" href="https://instagram.com/${esc(S.settings.instagram)}" target="_blank" rel="noopener">@${esc(S.settings.instagram)}</a>`:"us"} for drops.</p></div>`;
 if(!active().length)return S.isAdmin?`<div class="empty"><h3>No pieces in the shop yet</h3><a class="btn" href="#admin-new">Add your first product</a></div>`:`<div class="empty"><h3>New pieces are coming soon</h3></div>`;

function salesChart(){
 const days=14,W=640,H=200,L=52,B=26,T=12,R=6;const today=new Date();today.setHours(0,0,0,0);
 const bk=[];for(let i=days-1;i>=0;i--){const d=new Date(today);d.setDate(d.getDate()-i);bk.push({d,v:0})}
 S.orders.filter(isSale).forEach(o=>{const d=new Date(o.createdAt);d.setHours(0,0,0,0);const b=bk.find(x=>x.d.getTime()===d.getTime());if(b)b.v+=Number(o.subtotal)||0});
 const mx=Math.max(...bk.map(b=>b.v));const step=mx<=0?50:Math.pow(10,Math.floor(Math.log10(mx)));let top=Math.ceil(mx/step)*step;if(top<=0)top=100;

 let g="";[0,top/2,top].forEach(v=>{g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${money0(v)}</text>`});

async function changeStock(items,sign){
 const by={};items.forEach(i=>{(by[i.productId]=by[i.productId]||[]).push(i)});const short=[];
 for(const pid of Object.keys(by)){const p=S.products.find(x=>x.id===pid);if(!p)continue;const patch={};
  by[pid].forEach(i=>{const k=K(i.color,i.size);const cur=(k in patch?patch[k]:qtyOf(p,i.color,i.size));const n=cur-sign*(Number(i.qty)||0);if(n<0)short.push(`${p.name} ${i.color}/${i.size}`);patch[k]=Math.max(0,n)});
  await S.db.doc("products/"+pid).update({stock:patch,updatedAt:new Date().toISOString()})}
 return short;
}
async function setOrderStatus(id,to){
 const o=S.orders.find(x=>x.id===id);if(!o||S.busy)return;S.busy=true;render();
 try{let ded=!!o.stockDeducted;let short=[];
  if(["confirmed","paid","shipped"].includes(to)&&!ded){short=await changeStock(o.items||[],1);ded=true}
  if(["cancelled","requested"].includes(to)&&ded){await changeStock(o.items||[],-1);ded=false}
  await S.db.doc("orders/"+id).update({status:to,stockDeducted:ded,updatedAt:new Date().toISOString()});
  toast(short.length?`Order ${o.number} ${to}. Not enough stock for ${short.join(", ")}; set to 0.`:`Order ${o.number} marked ${to}`);
 }catch(e){toast("Couldn't update the order. Try again.")}
 S.busy=false;render();
}

const PAL={
 day:{top:[.40,.71,.86],bot:[.13,.45,.67],glow:[.92,.98,1],n:0},
 sunset:{top:[.99,.74,.56],bot:[.62,.40,.60],glow:[1,.86,.62],n:0},
 night:{top:[.10,.16,.33],bot:[.02,.05,.15],glow:[.62,.72,.92],n:1},
 dusk:{top:[.80,.55,.74],bot:[.36,.22,.50],glow:[1,.84,.80],n:0},
 morning:{top:[.76,.88,.93],bot:[.50,.73,.84],glow:[1,1,.97],n:0},

const Water={ok:null,raf:0,list:[],

 make(){

   const gl=c.getContext("webgl",{antialias:false});if(!gl)return null;

   const fs=`precision highp float;varying vec2 v;uniform float t,ar,w,nt;uniform vec3 aT,aB,aG,bT,bB,bG;
    float caustic(vec2 uv,float time){
     vec2 p=mod(uv*6.28318,6.28318)-250.;vec2 i=p;float c=1.;const float inten=.005;
     for(int n=0;n<5;n++){float tt=time*(1.-(3.5/float(n+1)));
      i=p+vec2(cos(tt-i.x)+sin(tt+i.y),sin(tt-i.y)+cos(tt+i.x));
      c+=1./length(vec2(p.x/(sin(i.x+tt)/inten),p.y/(cos(i.y+tt)/inten)));}
     c/=5.;c=1.17-pow(c,1.4);return pow(abs(c),8.);}
    void main(){vec2 p=v;float T=t*.45;
     float d=.85+.15*sin(T*.3+p.x*3.);
     vec2 o;
     o.x=sin(p.y*16.-T*1.1+sin(p.x*4.+T*.4)*1.5)*.006+sin(p.y*41.+p.x*9.-T*2.1)*.0022;
     o.y=sin(p.x*11.+T*.9+p.y*6.)*.007+cos(p.x*27.-T*1.7+p.y*13.)*.0025;

     vec3 top=mix(aT,bT,w),bot=mix(aB,bB,w),glow=mix(aG,bG,w);
     vec3 c=mix(top,bot,clamp(g,0.,1.));
     vec2 cuv=vec2(p.x*ar,p.y)*1.5+o*d*3.;
     float k=caustic(cuv,t*.16+23.);
     float k2=caustic(cuv*1.03+.01,t*.16+23.04);
     vec3 iri=.5+.5*cos(6.28318*(vec3(0.,.33,.67)+k*.6+p.x*.4));
     c+=glow*clamp(k,0.,1.)*.6+iri*clamp(k2-k*.6,0.,1.)*.14;
     vec2 mp=(p-vec2(.84,.14))*vec2(ar,1.);float md=length(mp);
     c+=nt*(vec3(.93,.95,1.)*smoothstep(.052,.036,md)+vec3(.55,.65,.9)*smoothstep(.45,0.,md)*.32);

   const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);

 attach(){

   const r=this.list[i];if(r.c.parentNode!==host)host.prepend(r.c);host.classList.add("gl");
  });
  if(this.ok&&!this.raf){const step=ts=>{this.raf=0;let any=false;SCENES.forEach((sc,i)=>{const r=this.list[i];if(r&&r.c.isConnected){any=true;this.draw(sc,r,ts/1000)}});if(any&&!this.reduce)this.raf=requestAnimationFrame(step)};this.raf=requestAnimationFrame(step)}

 draw(sc,r,t){

  if(c.width!==W||c.height!==H){c.width=W;c.height=H;gl.viewport(0,0,W,H)}

  gl.uniform1f(u.t,t);gl.uniform1f(u.ar,W/H);gl.uniform1f(u.w,w);gl.uniform1f(u.nt,nt);

  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  if(sc.toggle)c.parentNode.classList.toggle("night",nt>.5);
 }};

async function boot(){
 render();
 if(!window.claude?.use){try{const r=await fetch("data/catalog.json",{cache:"no-cache"});const j=await r.json();S.products=j.products||[];S.settings={...DEFAULTS,...(j.settings||{})};S.dbState="ready"}catch(e){S.dbState="none"}render();return}
 const [db,user]=await Promise.all([claude.use("db").catch(()=>null),claude.use("user").catch(()=>null)]);
 S.db=db;S.user=user;
 if(user){try{S.isAdmin=await user.canEdit();S.canWrite=await user.can("data.write")}catch(e){}}
 if(!db){S.dbState="none";render();return}
 db.collection("products").onSnapshot(s=>{S.products=s.docs.map(d=>({id:d.id,...d.data()}));S.dbState="ready";dataChanged()},()=>{S.dbState="error";render()});
 db.doc("settings/store").onSnapshot(s=>{S.settings={...DEFAULTS,...(s.exists?s.data():{})};dataChanged()},()=>{});
 if(S.isAdmin){
  db.collection("orders").orderBy("createdAt","desc").limit(500).onSnapshot(s=>{S.orders=s.docs.map(d=>({id:d.id,...d.data()}));dataChanged()},()=>{});
  db.collection("subscribers").onSnapshot(s=>{S.subs=s.docs.map(d=>d.data());if(route()==="admin-store")return;dataChanged()},()=>{});
  claude.use("assets").then(a=>{S.assets=a;if(route().startsWith("admin"))dataChanged()});
  claude.use("downloads").then(d=>{S.dl=d});
 }
 render();
}
boot();
</script>

</body>
</html>
